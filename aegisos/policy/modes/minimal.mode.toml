# AegisOS — Phase 2 M2.6: first real mode descriptor
# "minimal" mode — almost no privileges, used to prove the loader works.
# A process in minimal mode can read its own files and nothing else.
# Prove enforcement with: tests/verify_minimal_mode.sh

version = 1
name    = "minimal"
display_name = "Minimal (Test)"
description  = "Proof-of-concept mode with near-zero privileges. Used to validate the mode loader before building real modes."

[lsm_profile]
engine       = "apparmor"         # Decision pending M2.1 — using AppArmor as placeholder
profile_path = "/etc/aegis/apparmor/minimal"
enforce      = true

[namespaces]
net   = true
pid   = true
mount = true
user  = false   # user ns disabled — requires extra kernel hardening first
ipc   = true
uts   = false

[network]
allow_outbound = false
allow_inbound  = false
allowed_ports  = []
allowed_hosts  = []

[filesystem]
read_only_paths = ["/usr", "/lib", "/lib64", "/bin", "/sbin"]
denied_paths    = ["/etc/shadow", "/root", "/home", "/var/log"]
# No extra mounts — minimal mode sees only the base rootfs

[resources]
cpu_quota_percent = 10
memory_limit_mb   = 128
pids_max          = 64

[transition]
requires_auth  = "passphrase"
allowed_from   = []   # Can only be entered from the boot loader, not from another mode

[audit]
log_syscalls    = true
log_file_access = true
log_network     = true
log_transitions = true
